<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUV Compare · Jodhpur</title>
  <meta name="description" content="Ranked SUV comparison tool for Jodhpur, Rajasthan. Scored on safety, value, features, service, comfort and reliability. Updated June 2026.">
  <meta name="theme-color" content="#1d4ed8">

  <!-- Favicon — inline SVG, no file needed -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cg fill='white'%3E%3Crect x='5' y='16' width='22' height='7' rx='2'/%3E%3Cpath d='M8 16 L11 10 L21 10 L24 16Z'/%3E%3Ccircle cx='10' cy='23' r='2.5'/%3E%3Ccircle cx='22' cy='23' r='2.5'/%3E%3C/g%3E%3C/svg%3E">
  <!-- Apple touch icon — same SUV mark, larger blue square -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231d4ed8'/%3E%3Cg fill='white'%3E%3Crect x='28' y='90' width='124' height='42' rx='10'/%3E%3Cpath d='M45 90 L62 55 L118 55 L135 90Z'/%3E%3Ccircle cx='57' cy='132' r='16'/%3E%3Ccircle cx='123' cy='132' r='16'/%3E%3C/g%3E%3C/svg%3E">

  <!-- Open Graph -->
  <meta property="og:title" content="SUV Compare · Jodhpur">
  <meta property="og:description" content="Find your next SUV. Ranked for Jodhpur roads, budget and must-haves.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bharatrangwani.github.io/suv-compare/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">SUV Compare</h1>
    <div class="header-actions">
      <button id="profile-btn" class="btn-icon" title="Edit your profile" aria-label="Edit profile">⚙</button>
      <button id="refresh-btn" class="btn-icon" title="Refresh data" aria-label="Refresh database">↻</button>
      <button id="theme-toggle" class="btn-icon" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main id="app-content">
    <div id="tab-home" class="tab-pane active"></div>
    <div id="tab-compare" class="tab-pane hidden"></div>
    <div id="tab-ranking" class="tab-pane hidden"></div>
    <div id="tab-jodhpur" class="tab-pane hidden"></div>
  </main>

  <div id="data-timestamp" class="data-timestamp"></div>

  <nav class="tab-nav" role="tablist">
    <button class="tab-btn active" data-tab="home" role="tab" aria-selected="true">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">Home</span>
    </button>
    <button class="tab-btn" data-tab="compare" role="tab" aria-selected="false">
      <span class="tab-icon">⚖️</span>
      <span class="tab-label">Compare</span>
    </button>
    <button class="tab-btn" data-tab="ranking" role="tab" aria-selected="false">
      <span class="tab-icon">🏆</span>
      <span class="tab-label">Ranking</span>
    </button>
    <button class="tab-btn" data-tab="jodhpur" role="tab" aria-selected="false">
      <span class="tab-icon">₹</span>
      <span class="tab-label">Cost & Finance</span>
    </button>
  </nav>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
